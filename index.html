<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Resumen de uso, coste y latencia de modelos de lenguaje." />
    <title>Token Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-content">
        <a class="brand" href="#dashboard" aria-label="Token Dashboard, inicio">Token Dashboard</a>
        <span class="environment-label">Datos de uso</span>
      </div>
    </header>

    <main id="dashboard" class="dashboard-shell">
      <section class="page-heading" aria-labelledby="dashboard-title">
        <p class="eyebrow">Observabilidad de modelos</p>
        <h1 id="dashboard-title">Resumen de tokens</h1>
        <p>Una vista consolidada del volumen procesado y la latencia de los modelos disponibles.</p>
      </section>

      <section class="dashboard-content" aria-labelledby="summary-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Panorama</p>
            <h2 id="summary-title">Indicadores principales</h2>
          </div>
          <span class="source-label">Fuente: mock-data.json</span>
        </div>
        <div id="data-status" class="status-message" role="status" aria-live="polite">
          Cargando datos de los modelos...
        </div>
        <div id="summary-grid" class="summary-grid" aria-live="polite" hidden></div>
      </section>
    </main>

    <footer class="app-footer">Token Dashboard</footer>
    <script src="js/main.js"></script>
  </body>
</html>
